<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            padding: 30px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #00e5ff;
            border-radius: 15px;

            box-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
        }

        h1 {
            text-align: center;
            color: #00e5ff;
            margin-bottom: 25px;
            text-shadow: 0 0 10px #00e5ff;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #ffffff;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;

            background: #101820;
            color: white;

            border: 1px solid #00e5ff;
            border-radius: 7px;

            outline: none;
        }

        input:focus {
            box-shadow: 0 0 10px #00e5ff;
        }

        input[type="submit"] {
            margin-top: 10px;

            background: #00e5ff;
            color: #101820;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            border: none;
        }

        input[type="submit"]:hover {
            background: #39ff14;
            box-shadow: 0 0 15px #39ff14;
        }

        .message {
            text-align: center;
            color: #39ff14;
            margin-bottom: 15px;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #00e5ff;
            text-decoration: none;
            font-weight: bold;
        }

        .login a:hover {
            color: #39ff14;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>🎓 Student Registration</h1>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <form action="{% url 'login' %}"method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="sname">Student Name</label>
                <input
                    type="text"
                    id="sname"
                    name="sname"
                    required
                >
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="sid">Student ID</label>
                <input
                    type="number"
                    id="sid"
                    name="sid"
                    required
                >
            </div>

            <div class="form-group">
                <label for="scontact">Contact Number</label>
                <input
                    type="number"
                    id="scontact"
                    name="scontact"
                    required
                >
            </div>

            <div class="form-group">
                <label for="semail">Email</label>
                <input
                    type="email"
                    id="semail"
                    name="semail"
                    required
                >
            </div>

            <input type="submit" value="Register">

        </form>

        <div class="login">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </div>

    </div>

</body>

</html>
