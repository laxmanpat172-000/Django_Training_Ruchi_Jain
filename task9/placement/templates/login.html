<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);

            color: white;
        }

        .login-box {

            width: 380px;

            margin: 100px auto;
            padding: 35px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid #00e5ff;

            border-radius: 15px;

            box-shadow: 0 0 25px rgba(0, 229, 255, 0.4);

        }

        h1 {

            text-align: center;

            color: #00e5ff;

            margin-bottom: 30px;

            text-shadow: 0 0 10px #00e5ff;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: white;

        }

        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            box-sizing: border-box;

            background: #101820;

            color: white;

            border: 1px solid #00e5ff;

            border-radius: 7px;

            outline: none;

        }

        input:focus {

            box-shadow: 0 0 10px #00e5ff;

        }

        input::placeholder {

            color: #aaa;

        }

        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 7px;

            background: #00e5ff;

            color: #101820;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }

        button:hover {

            background: #39ff14;

            box-shadow: 0 0 15px #39ff14;

            transform: scale(1.02);

        }

        .error {

            margin-top: 15px;

            padding: 10px;

            text-align: center;

            color: #ff4d4d;

            font-weight: bold;

        }

        .signup {

            margin-top: 25px;

            text-align: center;

        }

        .signup a {

            color: #00e5ff;

            text-decoration: none;

            font-weight: bold;

        }

        .signup a:hover {

            color: #39ff14;

        }

    </style>

</head>


<body>


    <div class="login-box">

        <h1>🎓 Student Login</h1>


        <form action="{% url 'prediect' %}"method="POST">

            {% csrf_token %}


            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                🔐 Login
            </button>


        </form>


        {% if message %}

            <div class="error">
                {{ message }}
            </div>

        {% endif %}


        <div class="signup">

            Don't have an account?

            <a href="{% url 'registration' %}">
                Create Account
            </a>

        </div>


    </div>


</body>

</html>
