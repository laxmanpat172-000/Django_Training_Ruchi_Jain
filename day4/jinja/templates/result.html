<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <div> name: {{ name }}</div>
        <div> marks: {{ marks }}</div>
        {% if marks >= 80%}
            <h1>Distinction"A"</h1>
        {% elif marks >= 60%}
            <h1>First Class</h1>
        {% elif marks >= 50%}
            <h1>Second Class</h1>
        {% elif marks >= 35%}
            <h1>Pass</h1>
        {% else %}
            <h1>Fail</h1>
        {% endif %}
        <h1>Result</h1>
    </div>

    
</body>
</html>
