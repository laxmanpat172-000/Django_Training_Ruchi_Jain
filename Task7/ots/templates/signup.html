```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTS Signup</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* New Background */
            background:
                radial-gradient(circle at top left, #173b68, transparent 35%),
                radial-gradient(circle at bottom right, #4b1d68, transparent 35%),
                linear-gradient(135deg, #070b16, #101c38, #080b17);

            color: white;
            text-align: center;
            min-height: 100vh;
        }


        /* Header */

        header {
            padding: 30px;

            color: #c49aff;

            text-shadow:
                0 0 10px #7c4dff,
                0 0 20px #b23cff;
        }


        header h1 {
            font-size: 36px;
        }


        /* Main */

        main {
            margin-top: 40px;
        }


        /* Signup Box */

        .box {

            display: inline-block;

            width: 340px;
            max-width: 85%;

            padding: 40px 35px;

            border: 1px solid #a66cff;

            border-radius: 18px;

            background: rgba(15, 28, 58, 0.78);

            backdrop-filter: blur(10px);

            box-shadow:
                0 0 18px rgba(124, 77, 255, 0.30),
                0 0 35px rgba(0, 191, 255, 0.15);
        }


        .box h2 {

            color: #ffffff;

            text-shadow: 0 0 8px #7c4dff;

            margin-bottom: 30px;
        }


        /* Labels */

        label {

            display: block;

            color: #b9c9e8;

            margin-top: 15px;

            font-size: 14px;
        }


        /* Input */

        input {

            display: block;

            width: 230px;

            padding: 12px;

            margin: 8px auto 18px;

            background: rgba(5, 12, 30, 0.7);

            color: white;

            border: 1px solid #a66cff;

            border-radius: 8px;

            outline: none;

            transition: 0.3s;
        }


        input::placeholder {
            color: #7889aa;
        }


        input:focus {

            border-color: #4ddcff;

            box-shadow:
                0 0 10px #7c4dff,
                0 0 18px rgba(0, 191, 255, 0.3);
        }


        /* Signup Button */

        button {

            padding: 12px 35px;

            margin: 15px;

            border: 1px solid #a66cff;

            border-radius: 9px;

            background: rgba(124, 77, 255, 0.08);

            color: #c49aff;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: all 0.3s ease;
        }


        button:hover {

            background: linear-gradient(
                90deg,
                #7c4dff,
                #b23cff
            );

            color: white;

            border-color: white;

            box-shadow:
                0 0 12px #7c4dff,
                0 0 25px #b23cff;

            transform: translateY(-2px) scale(1.04);
        }


        /* Login Text */

        p {

            color: #9ba9c4;
        }


        a {

            color: #66e6ff;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }


        a:hover {

            color: #c49aff;

            text-shadow: 0 0 8px #7c4dff;
        }


        /* Mobile */

        @media (max-width: 500px) {

            header h1 {
                font-size: 28px;
            }

            .box {
                padding: 30px 15px;
            }

            input {
                width: 80%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>OTS Signup</h1>

</header>


<main>

    <section class="box">

        <h2>✨ Create Account</h2>


        <form method="POST">

            {% csrf_token %}


            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create password"
                required
            >


            <button type="submit">
                ✨ Signup
            </button>

        </form>


        <p>

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </p>


    </section>

</main>


</body>

</html>
```
