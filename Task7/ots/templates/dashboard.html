<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTS Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            /* New Background */
            background:
                radial-gradient(circle at top left, #243b80 0%, transparent 35%),
                radial-gradient(circle at bottom right, #6a1b9a 0%, transparent 35%),
                linear-gradient(135deg, #080b18, #111936, #090b17);

            color: white;
            text-align: center;
        }

        /* Header */

        header {
            padding: 35px 20px 20px;
        }

        header h1 {
            font-size: 38px;
            color: #66d9ff;

            text-shadow:
                0 0 10px #00bfff,
                0 0 25px #7c4dff;

            margin-bottom: 10px;
        }

        /* Main */

        main {
            margin-top: 35px;
        }

        /* Main Box */

        .box {
            display: inline-block;

            width: 430px;
            max-width: 90%;

            padding: 40px 35px;

            border: 1px solid rgba(102, 217, 255, 0.6);

            border-radius: 20px;

            background: rgba(15, 23, 55, 0.75);

            backdrop-filter: blur(12px);

            box-shadow:
                0 0 20px rgba(0, 191, 255, 0.25),
                0 0 50px rgba(124, 77, 255, 0.15);
        }

        .box h2 {
            margin-top: 0;

            font-size: 28px;

            color: #ffffff;

            text-shadow: 0 0 10px #7c4dff;
        }

        .box p {
            color: #b9c7e8;
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* Buttons */

        button {

            width: 280px;

            padding: 14px;

            margin: 9px;

            border: 1px solid #4ddcff;

            border-radius: 10px;

            background: rgba(20, 35, 75, 0.7);

            color: #66d9ff;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: all 0.3s ease;

        }

        button:hover {

            background: linear-gradient(
                90deg,
                #00bfff,
                #7c4dff
            );

            color: white;

            border-color: #ffffff;

            box-shadow:
                0 0 12px #00bfff,
                0 0 25px #7c4dff;

            transform: translateY(-3px) scale(1.03);

        }

        /* Remove link underline */

        a {
            text-decoration: none;
        }

        /* Footer */

        footer {

            margin-top: 60px;

            padding-bottom: 25px;

            color: #8995b5;

            font-size: 14px;

        }

        /* Mobile */

        @media (max-width: 500px) {

            header h1 {
                font-size: 28px;
            }

            .box {
                padding: 30px 15px;
            }

            button {
                width: 90%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>OTS - Online Testing System</h1>

</header>


<main>

    <section class="box">

        <h2>Welcome to OTS 👋</h2>

        <p>Select a test to continue</p>


        <a href="{% url 'test1' %}">
            <button type="button">
                📝 Test of 1 Question
            </button>
        </a>

        <br>


        <a href="{% url 'test3' %}">
            <button type="button">
                📚 Test of 3 Questions
            </button>
        </a>

        <br>


        <a href="{% url 'test5' %}">
            <button type="button">
                🎯 Test of 5 Questions
            </button>
        </a>

        <br>


        <a href="{% url 'history' %}">
            <button type="button">
                📊 Test History
            </button>
        </a>

    </section>

</main>


<footer>

    <p>© 2026 OTS - Online Testing System</p>

</footer>


</body>

</html>
