```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test History</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* New Background */
            background:
                radial-gradient(circle at top left, #162d5c, transparent 35%),
                radial-gradient(circle at bottom right, #35145c, transparent 35%),
                linear-gradient(135deg, #070b18, #101a35, #080b18);

            color: white;
            text-align: center;
            min-height: 100vh;
        }

        header {
            padding: 30px;

            color: #5ee7ff;

            text-shadow:
                0 0 10px #00bfff,
                0 0 20px #7c4dff;
        }

        main {
            width: 80%;
            margin: 40px auto;
        }

        .box {
            padding: 25px;

            border: 1px solid #4ddcff;

            border-radius: 15px;

            background: rgba(15, 25, 55, 0.75);

            box-shadow:
                0 0 15px rgba(0, 191, 255, 0.3),
                0 0 30px rgba(124, 77, 255, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;

            border: 1px solid #315a86;
        }

        th {
            color: #66e6ff;

            background: rgba(0, 191, 255, 0.08);
        }

        td {
            color: #dce9ff;
        }

        tr:hover {
            background: rgba(124, 77, 255, 0.12);
        }

        .performance {
            margin-top: 25px;
            padding: 15px;

            border: 1px solid #8b5cf6;

            border-radius: 10px;

            background: rgba(124, 77, 255, 0.08);

            box-shadow: 0 0 12px rgba(124, 77, 255, 0.2);
        }

        .performance h2 {
            color: #b58cff;

            text-shadow: 0 0 8px #7c4dff;
        }

        .performance p {
            color: #d9e4ff;
        }

        button {
            padding: 10px 25px;

            margin-top: 20px;

            border: 1px solid #4ddcff;

            border-radius: 8px;

            background: transparent;

            color: #5ee7ff;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(
                90deg,
                #00bfff,
                #7c4dff
            );

            color: white;

            border-color: white;

            box-shadow:
                0 0 12px #00bfff,
                0 0 20px #7c4dff;

            transform: scale(1.03);
        }

        a {
            text-decoration: none;
        }

        @media (max-width: 700px) {

            main {
                width: 94%;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px;
            }

        }

    </style>
</head>


<body>

<header>
    <h1>OTS - Test History</h1>
</header>


<main>

    <section class="box">

        <h2>Your Test History</h2>

        <table>

            <tr>
                <th>Test</th>
                <th>Total Questions</th>
                <th>Score</th>
            </tr>

            {% for test in tests %}

            <tr>
                <td>{{ test.test_name }}</td>
                <td>{{ test.total_questions }}</td>
                <td>{{ test.score }}</td>
            </tr>

            {% endfor %}

        </table>


        <section class="performance">

            <h2>Performance</h2>

            <p>
                Total Score:
                {{ total_score }} / {{ total_questions }}
            </p>

        </section>


        <a href="{% url 'dashboard' %}">
            <button type="button">Back to Dashboard</button>
        </a>

    </section>

</main>

</body>
</html>
```
