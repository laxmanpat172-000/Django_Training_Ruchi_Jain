```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test Result</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* New Background */
            background:
                radial-gradient(circle at top left, #173b68, transparent 35%),
                radial-gradient(circle at bottom right, #4b1d68, transparent 35%),
                linear-gradient(135deg, #070b16, #101c38, #080b17);

            color: white;
            text-align: center;
            min-height: 100vh;
        }


        /* Header */

        header {
            padding: 30px;

            color: #61e7ff;

            text-shadow:
                0 0 10px #00c8ff,
                0 0 20px #7c4dff;
        }


        header h1 {
            font-size: 36px;
        }


        /* Main */

        main {
            margin-top: 60px;
        }


        /* Result Box */

        .result-box {

            display: inline-block;

            width: 360px;
            max-width: 85%;

            padding: 40px 35px;

            border: 1px solid #45d9ff;

            border-radius: 18px;

            background: rgba(15, 28, 58, 0.78);

            backdrop-filter: blur(10px);

            box-shadow:
                0 0 18px rgba(0, 200, 255, 0.25),
                0 0 35px rgba(124, 77, 255, 0.20);
        }


        .result-box h2 {

            color: #ffffff;

            font-size: 28px;

            text-shadow: 0 0 8px #7c4dff;

            margin-bottom: 25px;
        }


        /* Score */

        .score {

            font-size: 30px;

            font-weight: bold;

            color: #66e6ff;

            text-shadow:
                0 0 8px #00bfff,
                0 0 18px #7c4dff;

            margin: 25px 0;
        }


        /* Result Message */

        .result-box p:not(.score) {

            color: #c7d4ed;

            font-size: 16px;
        }


        /* Buttons */

        button {

            width: 240px;

            padding: 12px;

            margin: 10px;

            border: 1px solid #4ddcff;

            border-radius: 9px;

            background: rgba(0, 191, 255, 0.08);

            color: #5ee7ff;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: all 0.3s ease;
        }


        /* Dashboard Button */

        a:first-of-type button:hover {

            background: linear-gradient(
                90deg,
                #00bfff,
                #0077ff
            );

            color: white;

            border-color: white;

            box-shadow:
                0 0 12px #00bfff,
                0 0 25px #0077ff;

            transform: translateY(-2px) scale(1.03);
        }


        /* History Button */

        a:last-of-type button {

            border-color: #a66cff;

            color: #c49aff;
        }


        a:last-of-type button:hover {

            background: linear-gradient(
                90deg,
                #7c4dff,
                #b23cff
            );

            color: white;

            border-color: white;

            box-shadow:
                0 0 12px #7c4dff,
                0 0 25px #b23cff;

            transform: translateY(-2px) scale(1.03);
        }


        a {
            text-decoration: none;
        }


        /* Mobile */

        @media (max-width: 500px) {

            header h1 {
                font-size: 28px;
            }

            .result-box {
                padding: 30px 15px;
            }

            button {
                width: 85%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>OTS - Test Result</h1>

</header>


<main>

    <section class="result-box">

        <h2>🎯 Your Result</h2>


        <p class="score">

            Score: {{ score }} / {{ total }}

        </p>


        {% if score == total %}

            <p>🎉 All Answers Correct!</p>

        {% else %}

            <p>✅ Test Completed!</p>

        {% endif %}


        <br>


        <a href="{% url 'dashboard' %}">
            <button type="button">
                🏠 Back to Dashboard
            </button>
        </a>


        <br>


        <a href="{% url 'history' %}">
            <button type="button">
                📊 View Test History
            </button>
        </a>


    </section>

</main>


</body>

</html>
```
